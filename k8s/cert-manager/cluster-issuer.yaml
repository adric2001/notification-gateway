# ==============================================================================
# Let's Encrypt ClusterIssuer Guide (k8s/cert-manager/cluster-issuer.yaml)
# ==============================================================================
# A ClusterIssuer represents a certificate authority (Let's Encrypt) from which
# signed x509 certificates can be obtained cluster-wide.
#
# Structure to write:
#
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-prod
# spec:
#   acme:
#     server: https://acme-v02.api.letsencrypt.org/directory
#     email: your-email@example.com # Let's Encrypt sends expiry warnings here
#     privateKeySecretRef:
#       name: letsencrypt-prod-account-key
#     solvers:
#       - http01:
#           ingress:
#             class: nginx # or traefik
