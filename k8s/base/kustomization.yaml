# ==============================================================================
# Kustomize Aggregation Guide (k8s/base/kustomization.yaml)
# ==============================================================================
# Kustomize lets you group and customize multiple Kubernetes manifests without
# templating engines. Running `kubectl apply -k k8s/base` applies all listed resources.
#
# Structure to write:
#
# apiVersion: kustomize.config.k8s.io/v1beta1
# kind: Kustomization
#
# resources:
#   - namespace.yaml
#   - configmap.yaml
#   - deployment.yaml
#   - service.yaml
#   - ingress.yaml
#   - servicemonitor.yaml
