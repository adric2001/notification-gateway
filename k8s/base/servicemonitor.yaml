# ==============================================================================
# Prometheus ServiceMonitor Guide (k8s/base/servicemonitor.yaml)
# ==============================================================================
# A ServiceMonitor is a Custom Resource Definition (CRD) provided by the
# Prometheus Operator (kube-prometheus-stack).
# It tells Prometheus to periodically scrape HTTP metrics from your application.
#
# Structure to write:
#
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
#   name: notification-gateway-monitor
#   namespace: gateway
#   labels:
#     release: prometheus # Must match the release name of your kube-prometheus-stack
# spec:
#   selector:
#     matchLabels:
#       app: notification-gateway
#   endpoints:
#     - port: http
#       path: /metrics
#       interval: 15s
