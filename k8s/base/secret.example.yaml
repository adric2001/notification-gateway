# ==============================================================================
# Kubernetes Secret Template Guide (k8s/base/secret.example.yaml)
# ==============================================================================
# Secrets store sensitive data (tokens, keys, passwords).
# NEVER commit your real secrets to Git! Copy this file to 'secret.yaml', fill in
# your real keys, and ensure 'secret.yaml' is ignored in .gitignore.
#
# Tip: Using 'stringData' allows you to write plain text strings; Kubernetes
# base64 encodes them for you automatically upon creation.
#
# Structure to write:
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gateway-secrets
#   namespace: gateway
# type: Opaque
# stringData:
#   API_SECRET_KEY: "your-custom-webhook-secret-key"
#   TELEGRAM_BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrSTUvwxYZ"
#   TELEGRAM_CHAT_ID: "987654321"
