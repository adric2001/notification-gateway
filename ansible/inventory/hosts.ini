# ==============================================================================
# Ansible Server Inventory (ansible/inventory/hosts.ini)
# ==============================================================================
# The inventory file tells Ansible which servers to connect to and configure.
# Groups (in brackets like [gateway_nodes]) let you organize servers by role.
#
# Replace the placeholder IP below with the 'instance_public_ip' from your
# Terraform outputs: `terraform -chdir=../terraform output instance_public_ip`

[gateway_nodes]
# Format: <hostname_alias> ansible_host=<PUBLIC_IP>
gateway-server ansible_host=203.0.113.10

[gateway_nodes:vars]
# Variables applied specifically to the gateway_nodes group
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
