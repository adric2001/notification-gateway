# ==============================================================================
# Ansible Configuration (ansible/ansible.cfg)
# ==============================================================================
# Ansible is an agentless automation tool that configures servers over SSH.
# This file sets default options so you don't need to type flags every time.
# Reference: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
# Default path to the server inventory file
inventory = inventory/hosts.ini

# Default remote SSH user for Ubuntu cloud images
remote_user = ubuntu

# Path to your private SSH key
private_key_file = ~/.ssh/notification-gateway-key.pem

# Host key checking:
# False prevents SSH prompts asking "Are you sure you want to continue connecting (yes/no)?"
# Convenient for cloud instances that frequently get recreated.
host_key_checking = False

# Maximum time (seconds) to wait for SSH connections
timeout = 30

# Enable colored terminal output and readable task timing
stdout_callback = yaml

[privilege_escalation]
# Automatically use 'sudo' for administrative commands on the remote server
become = True
become_method = sudo
become_user = root
become_ask_pass = False
